{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}

{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p class="meta"><time>{{ page.date | date(format="%d %B %Y") }}</time></p>{% endif %}
  {{ page.content | safe }}
  <p class="meta"><a href="..">← Back</a></p>
</article>
{% endblock %}
