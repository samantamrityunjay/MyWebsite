<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>

<body>
  <header>
    <a class="name" href="{{ config.base_url }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='@/blog/_index.md') }}">Writing</a>
      <a href="/resume">Resume</a>
      <button id="theme-toggle" aria-label="Toggle dark mode">◐</button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    © Mrityunjay Samanta ·
    <a href="mailto:hello@msamanta.com">Email</a> ·
    <a href="https://github.com/samantamrityunjay">GitHub</a> ·
    <a href="https://linkedin.com/in/msamanta">LinkedIn</a> ·
    <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">RSS</a>
  </footer>
  <script>
    document.getElementById('theme-toggle').onclick = function () {
      var d = document.documentElement;
      var cur = d.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = cur === 'dark' ? 'light' : 'dark';
      d.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    };
  </script>
</body>
</html>
