name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: site-${{ github.ref }}, cancel-in-progress: true }

env:
  ZOLA_VERSION: "0.23.6"
  ZOLA_SHA256: "8F5132B3522412D04E395E0B25F6D68613AD272A873E54A2B3EBF664873024A4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Install Zola
        run: |
          f=zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz
          curl -sSLO https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/$f
          echo "${ZOLA_SHA256}  $f" | sha256sum -c -
          tar -xzf $f && sudo mv zola /usr/local/bin/

      - run: zola build

      - name: Upload to WebDAV
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          sudo apt-get install -y -qq rclone
          export RCLONE_CONFIG_DAV_TYPE=webdav RCLONE_CONFIG_DAV_VENDOR=other
          export RCLONE_CONFIG_DAV_URL="$WEBDAV_URL" RCLONE_CONFIG_DAV_USER="$WEBDAV_USER"
          export RCLONE_CONFIG_DAV_PASS="$(rclone obscure "$WEBDAV_PASSWORD")"
          rclone sync public/ dav: --stats-one-line